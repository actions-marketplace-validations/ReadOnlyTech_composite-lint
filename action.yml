# yamllint disable rule:line-length
---

name: composite-lint
description: Opinionated all-in-one linting, installing only what the detected (or requested) languages need.
author: Matthew Read

branding:
  icon: check-circle
  color: green

# Versions: `<tool>-version` takes a raw version and `<tool>-version-file` a path to a file containing one;
# set at most one. Configs: `<tool>-config` takes a path. Every input except cache, config-file, and github-token can
# also be set in the config file; inputs take precedence, and anything unset uses what's bundled with the action.
inputs:
  cache:
    description: Whether to use the Actions cache for the linters, Go's module/build caches, golangci-lint's analysis cache, and Terraform providers.
    required: false
    default: 'true'
  config-file:
    description: "Settings file, as flat `key: value` lines using these inputs' names. Defaults to .composite-lint.yml in the repo root, if present."
    required: false
  exclude:
    description: Git pathspecs to exclude, comma- or whitespace-separated.
    required: false
  github-token:
    description: Token for zizmor's online audits and TFLint plugin downloads.
    required: false
    default: ${{ github.token }}
  languages:
    description: 'Languages to lint, comma- or whitespace-separated. Choices: actions, docker, go, pre-commit, python, shell, terraform, woke, yaml. If empty, auto-detected from the files present.'
    required: false
  paths:
    description: Paths to lint, comma- or whitespace-separated. Defaults to the repo root.
    required: false

  actionlint-config:
    description: actionlint config file.
    required: false
  actionlint-version:
    description: actionlint version.
    required: false
  actionlint-version-file:
    description: File containing the actionlint version.
    required: false
  flake8-config:
    description: flake8 config file.
    required: false
  flake8-version:
    description: flake8 version.
    required: false
  flake8-version-file:
    description: File containing the flake8 version.
    required: false
  go-version:
    description: Go version.
    required: false
  go-version-file:
    description: File containing the Go version, e.g. go.mod (the default).
    required: false
  golangci-lint-config:
    description: golangci-lint config file.
    required: false
  golangci-lint-version:
    description: golangci-lint version.
    required: false
  golangci-lint-version-file:
    description: File containing the golangci-lint version.
    required: false
  hadolint-config:
    description: hadolint config file.
    required: false
  hadolint-version:
    description: hadolint version.
    required: false
  hadolint-version-file:
    description: File containing the hadolint version.
    required: false
  pre-commit-config:
    description: pre-commit config file (by default, the repo's .pre-commit-config.yaml, else the bundled one, which runs detect-private-key and check-symlinks).
    required: false
  pre-commit-version:
    description: pre-commit version.
    required: false
  pre-commit-version-file:
    description: File containing the pre-commit version.
    required: false
  python-version:
    description: Python version used to run the Python-based linters.
    required: false
  python-version-file:
    description: File containing the Python version.
    required: false
  shellcheck-config:
    description: ShellCheck rcfile.
    required: false
  shellcheck-version:
    description: ShellCheck version.
    required: false
  shellcheck-version-file:
    description: File containing the ShellCheck version.
    required: false
  terraform-version:
    description: Terraform version.
    required: false
  terraform-version-file:
    description: File containing the Terraform version.
    required: false
  tflint-config:
    description: TFLint config file.
    required: false
  tflint-version:
    description: TFLint version.
    required: false
  tflint-version-file:
    description: File containing the TFLint version.
    required: false
  woke-config:
    description: woke config file.
    required: false
  woke-version:
    description: woke version.
    required: false
  woke-version-file:
    description: File containing the woke version.
    required: false
  yamllint-config:
    description: yamllint config file.
    required: false
  yamllint-version:
    description: yamllint version.
    required: false
  yamllint-version-file:
    description: File containing the yamllint version.
    required: false
  zizmor-config:
    description: zizmor config file.
    required: false
  zizmor-version:
    description: zizmor version.
    required: false
  zizmor-version-file:
    description: File containing the zizmor version.
    required: false

outputs:
  languages:
    description: JSON array of the languages that were linted.
    value: ${{ steps.detect.outputs.languages }}

runs:
  using: composite
  steps:
    - name: Detect languages
      id: detect
      env:
        LINT_CONFIG_FILE: ${{ inputs.config-file }}
        LINT_EXCLUDE: ${{ inputs.exclude }}
        LINT_GO_VERSION: ${{ inputs.go-version }}
        LINT_GO_VERSION_FILE: ${{ inputs.go-version-file }}
        LINT_LANGUAGES: ${{ inputs.languages }}
        LINT_PATHS: ${{ inputs.paths }}
        LINT_PYTHON_VERSION: ${{ inputs.python-version }}
        LINT_PYTHON_VERSION_FILE: ${{ inputs.python-version-file }}
        LINT_TERRAFORM_VERSION: ${{ inputs.terraform-version }}
        LINT_TERRAFORM_VERSION_FILE: ${{ inputs.terraform-version-file }}
      shell: bash
      run: |
        lint="${GITHUB_ACTION_PATH}/bin/lint.sh"
        readonly lint
        echo "languages=$("${lint}" detect)" >>"${GITHUB_OUTPUT}"
        # The runtimes' settings for the setup steps (e.g. python-version-file), resolved with the config file
        "${lint}" versions |
          awk '/^(go|python|terraform)-version/ { key = $1; sub(/^[^ ]+ /, ""); print key "=" $0 }' >>"${GITHUB_OUTPUT}"
        # rolls the golangci-lint cache over weekly so it doesn't go stale
        echo "week=$(date -u +%G-%V)" >>"${GITHUB_OUTPUT}"

    # The setup steps can fail without stopping the action; bin/lint.sh then fails only the languages that need
    # them and still runs the rest. setup-python falls back to the runner's own python3.
    - name: Set up Python
      id: python
      if: contains(fromJSON(steps.detect.outputs.languages), 'actions') || contains(fromJSON(steps.detect.outputs.languages), 'pre-commit') || contains(fromJSON(steps.detect.outputs.languages), 'python') || contains(fromJSON(steps.detect.outputs.languages), 'yaml')
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      continue-on-error: true
      with:
        python-version: ${{ steps.detect.outputs.python-version }}
        python-version-file: ${{ steps.detect.outputs.python-version-file }}
        # the linters get their own venvs; don't change the Python seen by the rest of the job
        update-environment: false

    - name: Set up Go
      if: contains(fromJSON(steps.detect.outputs.languages), 'go')
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      continue-on-error: true
      with:
        cache: ${{ inputs.cache }}
        cache-dependency-path: '**/go.sum'
        go-version: ${{ steps.detect.outputs.go-version }}
        go-version-file: ${{ steps.detect.outputs.go-version-file }}

    - name: Set up Terraform
      if: contains(fromJSON(steps.detect.outputs.languages), 'terraform')
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      continue-on-error: true
      with:
        # setup-terraform has no input for a version file, so this is resolved by bin/lint.sh
        terraform_version: ${{ steps.detect.outputs.terraform-version }}
        # The stdout wrapper would interfere with reading Terraform's output
        terraform_wrapper: false

    # The exact key depends on the resolved tool versions, which are only known once the Lint step runs, so restore
    # the latest entry by prefix and save under the exact key afterwards. Self-hosted runners keep the tool cache
    # between jobs anyway.
    - name: Restore linters
      id: tools-cache
      if: inputs.cache == 'true' && runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        # venvs only work with the exact Python they were made from
        key: composite-lint-tools-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-
        path: |
          ${{ runner.tool_cache }}/composite-lint/tools
          ${{ runner.tool_cache }}/composite-lint/venv
          ${{ runner.tool_cache }}/composite-lint/pre-commit
          ${{ runner.tool_cache }}/composite-lint/tflint-plugins
        restore-keys: composite-lint-tools-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-

    - name: Cache golangci-lint analysis
      if: inputs.cache == 'true' && contains(fromJSON(steps.detect.outputs.languages), 'go')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        key: composite-lint-golangci-${{ runner.os }}-${{ runner.arch }}-${{ steps.detect.outputs.week }}-${{ hashFiles('**/go.sum') }}
        path: ${{ runner.temp }}/golangci-lint
        restore-keys: composite-lint-golangci-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache Terraform providers
      if: inputs.cache == 'true' && contains(fromJSON(steps.detect.outputs.languages), 'terraform')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        key: composite-lint-terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        path: ${{ runner.temp }}/terraform-plugins
        restore-keys: composite-lint-terraform-${{ runner.os }}-${{ runner.arch }}-

    - name: Lint
      id: lint
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        LINT_ACTIONLINT_CONFIG: ${{ inputs.actionlint-config }}
        LINT_ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        LINT_ACTIONLINT_VERSION_FILE: ${{ inputs.actionlint-version-file }}
        LINT_CACHE: ${{ runner.tool_cache }}/composite-lint
        LINT_CONFIG_FILE: ${{ inputs.config-file }}
        LINT_EXCLUDE: ${{ inputs.exclude }}
        LINT_FLAKE8_CONFIG: ${{ inputs.flake8-config }}
        LINT_FLAKE8_VERSION: ${{ inputs.flake8-version }}
        LINT_FLAKE8_VERSION_FILE: ${{ inputs.flake8-version-file }}
        LINT_GOLANGCI_LINT_CONFIG: ${{ inputs.golangci-lint-config }}
        LINT_GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version }}
        LINT_GOLANGCI_LINT_VERSION_FILE: ${{ inputs.golangci-lint-version-file }}
        LINT_HADOLINT_CONFIG: ${{ inputs.hadolint-config }}
        LINT_HADOLINT_VERSION: ${{ inputs.hadolint-version }}
        LINT_HADOLINT_VERSION_FILE: ${{ inputs.hadolint-version-file }}
        LINT_LANGUAGES: ${{ steps.detect.outputs.languages }}
        LINT_PATHS: ${{ inputs.paths }}
        LINT_PRE_COMMIT_CONFIG: ${{ inputs.pre-commit-config }}
        LINT_PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
        LINT_PRE_COMMIT_VERSION_FILE: ${{ inputs.pre-commit-version-file }}
        # a restored cache would otherwise keep every version it's ever held
        LINT_PRUNE: ${{ steps.tools-cache.outcome == 'success' }}
        LINT_PYTHON: ${{ steps.python.outputs.python-path }}
        LINT_SHELLCHECK_CONFIG: ${{ inputs.shellcheck-config }}
        LINT_SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
        LINT_SHELLCHECK_VERSION_FILE: ${{ inputs.shellcheck-version-file }}
        LINT_TFLINT_CONFIG: ${{ inputs.tflint-config }}
        LINT_TFLINT_VERSION: ${{ inputs.tflint-version }}
        LINT_TFLINT_VERSION_FILE: ${{ inputs.tflint-version-file }}
        LINT_WOKE_CONFIG: ${{ inputs.woke-config }}
        LINT_WOKE_VERSION: ${{ inputs.woke-version }}
        LINT_WOKE_VERSION_FILE: ${{ inputs.woke-version-file }}
        LINT_YAMLLINT_CONFIG: ${{ inputs.yamllint-config }}
        LINT_YAMLLINT_VERSION: ${{ inputs.yamllint-version }}
        LINT_YAMLLINT_VERSION_FILE: ${{ inputs.yamllint-version-file }}
        LINT_ZIZMOR_CONFIG: ${{ inputs.zizmor-config }}
        LINT_ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
        LINT_ZIZMOR_VERSION_FILE: ${{ inputs.zizmor-version-file }}
        TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugins
      shell: bash
      # a tool that fails to install only fails the languages that need it, so lint regardless
      run: |
        lint="${GITHUB_ACTION_PATH}/bin/lint.sh"
        readonly lint
        echo "tools=$("${lint}" versions | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
        status=0
        "${lint}" install || status=${?}
        echo "installed=$((status == 0))" >>"${GITHUB_OUTPUT}"
        "${lint}" run || status=${?}
        readonly status
        exit "${status}"

    # saved even when linting fails, but only if every tool installed and the restored entry wasn't already this one
    - name: Save linters
      if: >-
        always() && steps.tools-cache.outcome == 'success' && steps.lint.outputs.installed == '1' &&
        steps.tools-cache.outputs.cache-matched-key != format('composite-lint-tools-{0}-{1}-py{2}-{3}', runner.os, runner.arch, steps.python.outputs.python-version, steps.lint.outputs.tools)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        key: composite-lint-tools-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ steps.lint.outputs.tools }}
        path: |
          ${{ runner.tool_cache }}/composite-lint/tools
          ${{ runner.tool_cache }}/composite-lint/venv
          ${{ runner.tool_cache }}/composite-lint/pre-commit
          ${{ runner.tool_cache }}/composite-lint/tflint-plugins
