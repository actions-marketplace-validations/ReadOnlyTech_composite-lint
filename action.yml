# yamllint disable rule:line-length
---

name: composite-lint
description: Runs an opinionated set of linters. Installs only the tools that the found or requested languages need.
author: Matthew Read

branding:
  icon: check-circle
  color: green

# Versions: `<tool>-version` takes a raw version. `<tool>-version-file` takes the path to a file that contains a
# version. Set only one of the two. Linter configs: `<tool>-config` takes a path. You can also set all of the inputs
# except cache, config-file, and github-token in the config file. Inputs have priority over the config file. If neither
# sets a value, the action uses the file of the repo, if it exists. If not, the action uses the bundled file.
inputs:
  cache:
    description: 'Whether to keep these items in the Actions cache: the linters, the module and build caches of Go, the analysis cache of golangci-lint, and the Terraform providers.'
    required: false
    default: 'true'
  config-file:
    description: 'Config file, with flat `key: value` lines that use the names of these inputs. The default is the .composite-lint.yml file in the repo root, if it exists.'
    required: false
  # bin/lint.sh applies the defaults for exclude, include-hidden, and include-ignored. Thus, a config file can set them.
  exclude:
    description: 'Paths and glob patterns to exclude, separated by commas or whitespace. In a pattern, `*` matches in one directory, and `**` matches across directories. A path or pattern also excludes all of the files under each match. The default is `.git **/node_modules`. If you set this input, your value replaces the default.'
    required: false
  github-token:
    description: Token for the online audits of zizmor and for the TFLint plugin downloads.
    required: false
    default: ${{ github.token }}
  include-hidden:
    description: Whether the files that git ignores also include hidden files, like `ls -a`. A file is hidden when a part of its path starts with `.`. This input requires include-ignored, because the action always lints the hidden files that git does not ignore. The default is false.
    required: false
  include-ignored:
    description: Whether to also lint the files that git ignores, like `ls`. If false, the action lints only the files that git tracks and the untracked files that git does not ignore. Also see include-hidden. The default is false.
    required: false
  languages:
    description: 'Languages to lint, separated by commas or whitespace. Choices: actions, docker, go, pre-commit, python, shell, terraform, woke, yaml. If empty, the action finds the languages from the files in the repo.'
    required: false
  paths:
    description: Paths to lint, separated by commas or whitespace. The default is the repo root.
    required: false

  actionlint-config:
    description: actionlint config file.
    required: false
  actionlint-version:
    description: actionlint version.
    required: false
  actionlint-version-file:
    description: File that contains the actionlint version. The default is the .actionlint-version file in the repo root, if it exists.
    required: false
  flake8-config:
    description: flake8 config file.
    required: false
  flake8-version:
    description: flake8 version.
    required: false
  flake8-version-file:
    description: File that contains the flake8 version. The default is the .flake8-version file in the repo root, if it exists.
    required: false
  go-version:
    description: Go version.
    required: false
  go-version-file:
    description: File that contains the Go version. The default is the go.mod file in the repo root. If go.mod does not exist, the default is the .go-version file in the repo root, if it exists.
    required: false
  golangci-lint-config:
    description: golangci-lint config file.
    required: false
  golangci-lint-version:
    description: golangci-lint version.
    required: false
  golangci-lint-version-file:
    description: File that contains the golangci-lint version. The default is the .golangci-lint-version file in the repo root, if it exists.
    required: false
  hadolint-config:
    description: hadolint config file.
    required: false
  hadolint-version:
    description: hadolint version.
    required: false
  hadolint-version-file:
    description: File that contains the hadolint version. The default is the .hadolint-version file in the repo root, if it exists.
    required: false
  pre-commit-config:
    description: pre-commit config file. The default is the .pre-commit-config.yaml file of the repo. If that file does not exist, the default is the bundled file, which runs detect-private-key and check-symlinks.
    required: false
  pre-commit-version:
    description: pre-commit version.
    required: false
  pre-commit-version-file:
    description: File that contains the pre-commit version. The default is the .pre-commit-version file in the repo root, if it exists.
    required: false
  python-version:
    description: Python version for the linters that use Python.
    required: false
  python-version-file:
    description: File that contains the Python version. The default is the .python-version file in the repo root, if it exists.
    required: false
  shellcheck-config:
    description: ShellCheck rcfile.
    required: false
  shellcheck-version:
    description: ShellCheck version.
    required: false
  shellcheck-version-file:
    description: File that contains the ShellCheck version. The default is the .shellcheck-version file in the repo root, if it exists.
    required: false
  terraform-version:
    description: Terraform version.
    required: false
  terraform-version-file:
    description: File that contains the Terraform version. The default is the .terraform-version file in the repo root, if it exists.
    required: false
  tflint-config:
    description: TFLint config file.
    required: false
  tflint-version:
    description: TFLint version.
    required: false
  tflint-version-file:
    description: File that contains the TFLint version. The default is the .tflint-version file in the repo root, if it exists.
    required: false
  woke-config:
    description: woke config file.
    required: false
  woke-version:
    description: woke version.
    required: false
  woke-version-file:
    description: File that contains the woke version. The default is the .woke-version file in the repo root, if it exists.
    required: false
  yamllint-config:
    description: yamllint config file.
    required: false
  yamllint-version:
    description: yamllint version.
    required: false
  yamllint-version-file:
    description: File that contains the yamllint version. The default is the .yamllint-version file in the repo root, if it exists.
    required: false
  zizmor-config:
    description: zizmor config file.
    required: false
  zizmor-version:
    description: zizmor version.
    required: false
  zizmor-version-file:
    description: File that contains the zizmor version. The default is the .zizmor-version file in the repo root, if it exists.
    required: false

outputs:
  languages:
    description: JSON array of the languages that were linted.
    value: ${{ steps.detect.outputs.languages }}

runs:
  using: composite
  steps:
    - name: Detect languages
      id: detect
      env:
        LINT_CONFIG_FILE: ${{ inputs.config-file }}
        LINT_EXCLUDE: ${{ inputs.exclude }}
        LINT_GO_VERSION: ${{ inputs.go-version }}
        LINT_GO_VERSION_FILE: ${{ inputs.go-version-file }}
        LINT_INCLUDE_HIDDEN: ${{ inputs.include-hidden }}
        LINT_INCLUDE_IGNORED: ${{ inputs.include-ignored }}
        LINT_LANGUAGES: ${{ inputs.languages }}
        LINT_PATHS: ${{ inputs.paths }}
        LINT_PYTHON_VERSION: ${{ inputs.python-version }}
        LINT_PYTHON_VERSION_FILE: ${{ inputs.python-version-file }}
        LINT_TERRAFORM_VERSION: ${{ inputs.terraform-version }}
        LINT_TERRAFORM_VERSION_FILE: ${{ inputs.terraform-version-file }}
      shell: bash
      run: |
        lint="${GITHUB_ACTION_PATH}/bin/lint.sh"
        readonly lint
        echo "languages=$("${lint}" detect)" >>"${GITHUB_OUTPUT}"
        # The runtime settings for the setup steps (for example, python-version-file), with the config file applied
        "${lint}" versions |
          awk '/^(go|python|terraform)-version/ { key = $1; sub(/^[^ ]+ /, ""); print key "=" $0 }' >>"${GITHUB_OUTPUT}"
        # A new golangci-lint cache key each week, so that the cache does not become stale
        echo "week=$(date -u +%G-%V)" >>"${GITHUB_OUTPUT}"

    # The setup steps can fail without stopping the action. Then bin/lint.sh fails only the languages that need them,
    # and it lints the other languages. If setup-python fails, the action uses the python3 of the runner.
    - name: Set up Python
      id: python
      if: contains(fromJSON(steps.detect.outputs.languages), 'actions') || contains(fromJSON(steps.detect.outputs.languages), 'pre-commit') || contains(fromJSON(steps.detect.outputs.languages), 'python') || contains(fromJSON(steps.detect.outputs.languages), 'yaml')
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      continue-on-error: true
      with:
        python-version: ${{ steps.detect.outputs.python-version }}
        python-version-file: ${{ steps.detect.outputs.python-version-file }}
        # The linters get their own venvs. Thus, the Python for the other steps of the job stays the same.
        update-environment: false

    - name: Set up Go
      if: contains(fromJSON(steps.detect.outputs.languages), 'go')
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      continue-on-error: true
      with:
        cache: ${{ inputs.cache }}
        cache-dependency-path: '**/go.sum'
        go-version: ${{ steps.detect.outputs.go-version }}
        go-version-file: ${{ steps.detect.outputs.go-version-file }}

    - name: Set up Terraform
      if: contains(fromJSON(steps.detect.outputs.languages), 'terraform')
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      continue-on-error: true
      with:
        # setup-terraform has no input for a version file. Thus, bin/lint.sh reads the version file.
        terraform_version: ${{ steps.detect.outputs.terraform-version }}
        # The stdout wrapper interferes when bin/lint.sh reads the output of Terraform.
        terraform_wrapper: false

    # The exact key depends on the tool versions, which are known only when the Lint step runs. Thus, this step
    # restores the latest entry by its prefix, and a later step saves the entry with the exact key. Self-hosted runners
    # keep the tool cache between jobs, so they do not use this cache.
    - name: Restore linters
      id: tools-cache
      if: inputs.cache == 'true' && runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        # A venv works only with the exact Python that made it.
        key: composite-lint-tools-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-
        path: |
          ${{ runner.tool_cache }}/composite-lint/tools
          ${{ runner.tool_cache }}/composite-lint/venv
          ${{ runner.tool_cache }}/composite-lint/pre-commit
          ${{ runner.tool_cache }}/composite-lint/tflint-plugins
        restore-keys: composite-lint-tools-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-

    - name: Cache golangci-lint analysis
      if: inputs.cache == 'true' && contains(fromJSON(steps.detect.outputs.languages), 'go')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        key: composite-lint-golangci-${{ runner.os }}-${{ runner.arch }}-${{ steps.detect.outputs.week }}-${{ hashFiles('**/go.sum') }}
        path: ${{ runner.temp }}/golangci-lint
        restore-keys: composite-lint-golangci-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache Terraform providers
      if: inputs.cache == 'true' && contains(fromJSON(steps.detect.outputs.languages), 'terraform')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        key: composite-lint-terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        path: ${{ runner.temp }}/terraform-plugins
        restore-keys: composite-lint-terraform-${{ runner.os }}-${{ runner.arch }}-

    - name: Lint
      id: lint
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        LINT_ACTIONLINT_CONFIG: ${{ inputs.actionlint-config }}
        LINT_ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        LINT_ACTIONLINT_VERSION_FILE: ${{ inputs.actionlint-version-file }}
        LINT_CACHE: ${{ runner.tool_cache }}/composite-lint
        LINT_CONFIG_FILE: ${{ inputs.config-file }}
        LINT_EXCLUDE: ${{ inputs.exclude }}
        LINT_FLAKE8_CONFIG: ${{ inputs.flake8-config }}
        LINT_FLAKE8_VERSION: ${{ inputs.flake8-version }}
        LINT_FLAKE8_VERSION_FILE: ${{ inputs.flake8-version-file }}
        LINT_GOLANGCI_LINT_CONFIG: ${{ inputs.golangci-lint-config }}
        LINT_GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version }}
        LINT_GOLANGCI_LINT_VERSION_FILE: ${{ inputs.golangci-lint-version-file }}
        LINT_HADOLINT_CONFIG: ${{ inputs.hadolint-config }}
        LINT_HADOLINT_VERSION: ${{ inputs.hadolint-version }}
        LINT_HADOLINT_VERSION_FILE: ${{ inputs.hadolint-version-file }}
        LINT_INCLUDE_HIDDEN: ${{ inputs.include-hidden }}
        LINT_INCLUDE_IGNORED: ${{ inputs.include-ignored }}
        LINT_LANGUAGES: ${{ steps.detect.outputs.languages }}
        LINT_PATHS: ${{ inputs.paths }}
        LINT_PRE_COMMIT_CONFIG: ${{ inputs.pre-commit-config }}
        LINT_PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
        LINT_PRE_COMMIT_VERSION_FILE: ${{ inputs.pre-commit-version-file }}
        # Without this, a restored cache keeps every version that it ever contained.
        LINT_PRUNE: ${{ steps.tools-cache.outcome == 'success' }}
        LINT_PYTHON: ${{ steps.python.outputs.python-path }}
        LINT_SHELLCHECK_CONFIG: ${{ inputs.shellcheck-config }}
        LINT_SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
        LINT_SHELLCHECK_VERSION_FILE: ${{ inputs.shellcheck-version-file }}
        LINT_TFLINT_CONFIG: ${{ inputs.tflint-config }}
        LINT_TFLINT_VERSION: ${{ inputs.tflint-version }}
        LINT_TFLINT_VERSION_FILE: ${{ inputs.tflint-version-file }}
        LINT_WOKE_CONFIG: ${{ inputs.woke-config }}
        LINT_WOKE_VERSION: ${{ inputs.woke-version }}
        LINT_WOKE_VERSION_FILE: ${{ inputs.woke-version-file }}
        LINT_YAMLLINT_CONFIG: ${{ inputs.yamllint-config }}
        LINT_YAMLLINT_VERSION: ${{ inputs.yamllint-version }}
        LINT_YAMLLINT_VERSION_FILE: ${{ inputs.yamllint-version-file }}
        LINT_ZIZMOR_CONFIG: ${{ inputs.zizmor-config }}
        LINT_ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
        LINT_ZIZMOR_VERSION_FILE: ${{ inputs.zizmor-version-file }}
        TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugins
      shell: bash
      # If a tool does not install, only the languages that need it fail. Thus, the step lints after a failed install.
      run: |
        lint="${GITHUB_ACTION_PATH}/bin/lint.sh"
        readonly lint
        echo "tools=$("${lint}" versions | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
        status=0
        "${lint}" install || status=${?}
        echo "installed=$((status == 0))" >>"${GITHUB_OUTPUT}"
        "${lint}" run || status=${?}
        readonly status
        exit "${status}"

    # This step saves the cache when linting fails too. It saves only when all of the tools installed, and when the
    # restored entry does not have this exact key.
    - name: Save linters
      if: >-
        always() && steps.tools-cache.outcome == 'success' && steps.lint.outputs.installed == '1' &&
        steps.tools-cache.outputs.cache-matched-key != format('composite-lint-tools-{0}-{1}-py{2}-{3}', runner.os, runner.arch, steps.python.outputs.python-version, steps.lint.outputs.tools)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        key: composite-lint-tools-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ steps.lint.outputs.tools }}
        path: |
          ${{ runner.tool_cache }}/composite-lint/tools
          ${{ runner.tool_cache }}/composite-lint/venv
          ${{ runner.tool_cache }}/composite-lint/pre-commit
          ${{ runner.tool_cache }}/composite-lint/tflint-plugins
