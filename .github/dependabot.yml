---

version: 2

updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: 'chore(actions): '
    cooldown:
      default-days: 7
    directory: '/'
    labels:
      - chore
    open-pull-requests-limit: 20
    schedule:
      interval: daily

  - package-ecosystem: pip
    commit-message:
      prefix: 'ci(pip): '
    cooldown:
      default-days: 7
    directory: '/versions/pip'
    labels:
      - ci
    open-pull-requests-limit: 20
    schedule:
      interval: daily
