# yamllint disable rule:line-length
---

name: Update README

on:  # yamllint disable-line rule:truthy
  # scripts/tag_release.sh pushes the vX.Y.Z tag last, after the floating tags
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

permissions: {}

jobs:
  readme:
    name: Update README
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to push the update branch
      pull-requests: write  # to open the PR
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.BASE_BRANCH }}

      # The examples use the newest release's tag (releases are immutable) and the bundled pre-commit-hooks rev, which
      # is a commit hash with a `# frozen: vX.Y.Z` comment (its releases aren't immutable). The default branch only
      # takes changes through PRs, so this opens one.
      - name: Open README update PR as needed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: auto-update-readme
          REPO: ${{ github.repository }}
        run: |
          # without shell: bash, pipefail is off, which would let a failed `gh api` give an empty tag
          set -o pipefail

          # The newest full release, also on manual runs. The API lists tags alphabetically, so v0.0.10 would come
          # before v0.0.2 without sort -V.
          release_tag="$(gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          hooks_rev="$(sed -nE 's/^\s*rev:\s*(.+)$/\1/p' configs/pre-commit.yaml)"
          readonly release_tag hooks_rev
          sed -Ei \
            -e "s|(uses: ReadOnlyTech/composite-lint@).*|\1${release_tag}|" \
            -e "\|repo: https://github.com/ReadOnlyTech/composite-lint$|{n;s|(rev: ).*|\1${release_tag}|}" \
            -e "\|repo: https://github.com/pre-commit/pre-commit-hooks$|{n;s|(rev: ).*|\1${hooks_rev}|}" \
            README.md
          if git diff --quiet; then
            echo 'The README already uses this release'
            exit
          fi

          for pr in $(gh pr list --head "${PR_BRANCH}" --state open --json number --jq '.[].number'); do
            gh pr close "${pr}" --comment 'Superseded by a newer release.' --delete-branch
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Checkout doesn't persist credentials, so authenticate the push with GH_TOKEN via gh
          gh auth setup-git
          git checkout -b "${PR_BRANCH}"
          git commit -am "docs: use ${release_tag} in the README examples"
          git push --force origin "${PR_BRANCH}"
          gh pr create \
            --title "docs: use ${release_tag} in the README examples" \
            --body "Points the README examples at ${release_tag}, the latest release." \
            --head "${PR_BRANCH}" \
            --base "${BASE_BRANCH}"

          # Events caused by GITHUB_TOKEN don't start workflows (pull_request_target included),
          # so the validation workflow will have to be manually approved on that PR!
