# yamllint disable rule:line-length
---

name: Lint and Test

on:  # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

permissions: {}

jobs:
  validate:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # settings, like excluding the intentionally failing tests, are in .composite-lint.yml
      - name: Lint repo
        uses: $/

      - name: Run test fixtures
        if: ${{ !cancelled() }}
        run: tests/run.sh

      - name: Run release script tests
        if: ${{ !cancelled() }}
        run: tests/tag_release.sh
